name: Reproduce public-data analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - run: pip install -r requirements.lock.txt
      - run: Rscript setup.R
      - run: R_LIBS_USER="$PWD/.Rlibrary" bash run_all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregate-analysis-evidence
          path: |
            reports/
            evidence/
